<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2456f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GPSLogger" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>GPSLogger</title>
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/static/icons/favicon-16x16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/static/icons/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/static/icons/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/components.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="app-header-leading">
          <button
            id="map-sidebar-toggle"
            class="icon-btn map-sidebar-toggle"
            type="button"
            aria-controls="page-map"
            aria-expanded="false"
            aria-label="Menü öffnen"
          >
            <span class="material-symbols-outlined">menu</span>
          </button>
          <button id="brand-home" class="brand brand-home" type="button" aria-label="Zur Karte">
            <span class="material-symbols-outlined">route</span>
            <span>GPSLogger</span>
          </button>
        </div>
      </header>
      <main>
        <section id="page-map" class="page"></section>
        <section id="page-settings" class="page"></section>
      </main>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>

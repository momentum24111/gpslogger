<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPSLogger – API</title>
    <link rel="icon" href="/static/icons/icon.svg?v=20260511" type="image/svg+xml" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link id="theme-css" rel="stylesheet" href="/themes/dark/theme.css" />
    <script>
      (function () {
        var t = new URLSearchParams(location.search).get("theme");
        if (t === "light" || t === "dark") {
          document.getElementById("theme-css").href = "/themes/" + t + "/theme.css";
        }
      })();
    </script>
    <!-- Swagger UI: /dist/ ist korrekt; kein crossorigin bei <script> (sonst CORS am Skript). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui@5.11.2/dist/swagger-ui.css" />
    <link rel="stylesheet" href="/static/api-docs.css" />
  </head>
  <body>
    <header class="api-docs-header">
      <a class="api-docs-back" href="/">Zur Anwendung</a>
      <span class="api-docs-title">API‑Referenz</span>
      <span class="api-docs-meta">
        <a id="openapi-json-link" href="/api/openapi.json" download="gpslogger-openapi.json">OpenAPI JSON</a>
      </span>
    </header>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui@5.11.2/dist/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui@5.11.2/dist/swagger-ui-standalone-preset.js"></script>
    <script>
      (function () {
        var pathname = window.location.pathname.replace(/\/+$/, "");
        if (!pathname) pathname = "/api";
        var specUrl = pathname + "/openapi.json";
        var link = document.getElementById("openapi-json-link");
        if (link) link.href = specUrl;
        window.ui = SwaggerUIBundle({
          url: specUrl,
          dom_id: "#swagger-ui",
          deepLinking: true,
          displayRequestDuration: true,
          tryItOutEnabled: true,
          filter: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: "StandaloneLayout",
          validatorUrl: null,
        });
      })();
    </script>
  </body>
</html>
